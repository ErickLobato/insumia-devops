name: Insumia CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: 1. Build Aplicacao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar projeto com Maven
        run: mvn clean compile

  test:
    name: 2. Testes Automatizados
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Executar Testes Unitarios JUnit
        run: mvn test

      - name: Validar Build da Imagem Docker
        run: docker build -t insumia-api:latest .

  deploy-staging:
    name: 3. Deploy em Staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Simulacao de Deploy no Ambiente de Staging
        run: |
          echo "Iniciando deploy da imagem insumia-api:latest em STAGING..."
          echo "Variaveis configuradas: ENV=staging"
          echo "Healthcheck em staging.insumia.com/insumos -> HTTP 200 OK"
          echo "Deploy em Staging concluido com sucesso!"

  deploy-production:
    name: 4. Deploy em Producao
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Simulacao de Deploy no Ambiente de Producao
        run: |
          echo "Iniciando promocao da release para PRODUCAO..."
          echo "Variaveis configuradas: ENV=production"
          echo "Healthcheck em api.insumia.com/insumos -> HTTP 200 OK"
          echo "Deploy em Producao concluido com sucesso!"